<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="skillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" fill="url(#skillBg)"/>
  
  <!-- Tech & Code lines -->
  <path d="M30 180 L 120 180 L 160 140 L 260 140 L 300 180 L 370 180" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.35" fill="none"/>

  <!-- Large Mechanical Cogwheel (Center-Left) -->
  <g transform="translate(110, 60)">
    <circle cx="50" cy="50" r="35" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="50" cy="50" r="16" fill="#042f2e"/>
    <!-- Cog Teeth -->
    <rect x="44" y="6" width="12" height="14" rx="2" fill="#ffffff"/>
    <rect x="44" y="80" width="12" height="14" rx="2" fill="#ffffff"/>
    <rect x="6" y="44" width="14" height="12" rx="2" fill="#ffffff"/>
    <rect x="80" y="44" width="14" height="12" rx="2" fill="#ffffff"/>
    <rect x="18" y="18" width="12" height="12" rx="2" transform="rotate(45 24 24)" fill="#ffffff"/>
    <rect x="70" y="70" width="12" height="12" rx="2" transform="rotate(45 76 76)" fill="#ffffff"/>
    <rect x="70" y="18" width="12" height="12" rx="2" transform="rotate(-45 76 24)" fill="#ffffff"/>
    <rect x="18" y="70" width="12" height="12" rx="2" transform="rotate(-45 24 76)" fill="#ffffff"/>
  </g>

  <!-- Smaller Interlocking Cogwheel (Center-Right) -->
  <g transform="translate(195, 40)">
    <circle cx="35" cy="35" r="25" fill="#facc15"/>
    <circle cx="35" cy="35" r="11" fill="#134e4a"/>
    <!-- Teeth -->
    <rect x="30" y="3" width="10" height="10" rx="2" fill="#facc15"/>
    <rect x="30" y="57" width="10" height="10" rx="2" fill="#facc15"/>
    <rect x="3" y="30" width="10" height="10" rx="2" fill="#facc15"/>
    <rect x="57" y="30" width="10" height="10" rx="2" fill="#facc15"/>
  </g>

  <!-- Laptop / Digital Skills & Career (Right) -->
  <g transform="translate(255, 95)">
    <!-- Screen -->
    <rect x="10" y="5" width="70" height="46" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <rect x="15" y="10" width="60" height="34" rx="2" fill="#1e293b"/>
    <!-- Code prompt symbols inside screen -->
    <text x="20" y="24" font-family="monospace" font-size="10" fill="#2dd4bf">&lt;/&gt;</text>
    <line x1="42" y1="22" x2="68" y2="22" stroke="#ffffff" stroke-width="2"/>
    <line x1="20" y1="32" x2="55" y2="32" stroke="#facc15" stroke-width="2"/>
    <!-- Base -->
    <path d="M0 52 L 90 52 L 82 58 L 8 58 Z" fill="#94a3b8"/>
  </g>

  <!-- Craftsman Wrench (Left) -->
  <g transform="translate(45, 80) rotate(-35)">
    <rect x="10" y="25" width="40" height="8" rx="2" fill="#e2e8f0"/>
    <circle cx="10" cy="29" r="12" fill="#cbd5e1"/>
    <rect x="2" y="24" width="12" height="10" fill="#042f2e"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="20" y="20" width="150" height="28" rx="14" fill="#042f2e" fill-opacity="0.85" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#99f6e4" letter-spacing="0.5">⚙️ KAUSHAL &amp; ROJGAR</text>
</svg>
