<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="socBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" fill="url(#socBg)"/>
  
  <!-- Radiating Rings of Support -->
  <circle cx="200" cy="110" r="85" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6"/>
  <circle cx="200" cy="110" r="130" fill="none" stroke="#c7d2fe" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Helping Hands Embracing Community (Center) -->
  <g transform="translate(135, 60)">
    <!-- Protective Aura Heart -->
    <path d="M65 35 C 65 15 45 10 32 25 C 20 10 0 15 0 35 C 0 60 32 85 32 85 C 32 85 65 60 65 35 Z" fill="#ec4899" fill-opacity="0.2" transform="translate(35, -5) scale(1.1)"/>
    <!-- Left Hand Palm Up -->
    <path d="M20 70 Q 40 40 70 50 Q 80 55 85 70 Q 75 90 40 95 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Right Hand Palm Up -->
    <path d="M110 70 Q 90 40 60 50 Q 50 55 45 70 Q 55 90 90 95 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Central Star / Joy -->
    <circle cx="65" cy="40" r="14" fill="#facc15"/>
    <circle cx="65" cy="40" r="6" fill="#312e81"/>
  </g>

  <!-- Divyangjan / Wheelchair Accessibility (Left) -->
  <g transform="translate(45, 75)">
    <circle cx="30" cy="20" r="8" fill="#ffffff"/>
    <path d="M30 30 L 30 50 L 45 50 L 45 70" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="56" r="18" fill="none" stroke="#facc15" stroke-width="4"/>
  </g>

  <!-- Senior Citizen Pension Umbrella (Right) -->
  <g transform="translate(290, 65)">
    <!-- Umbrella Canopy -->
    <path d="M10 50 Q 45 10 80 50 Z" fill="#f43f5e"/>
    <line x1="45" y1="20" x2="45" y2="70" stroke="#ffffff" stroke-width="3"/>
    <path d="M45 70 Q 45 80 35 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45" cy="18" r="3" fill="#facc15"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="20" y="20" width="165" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2"/>
  <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="0.5">🤝 SAMAJIK KALYAN</text>
</svg>
