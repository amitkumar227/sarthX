<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="houseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" fill="url(#houseBg)"/>
  
  <!-- Architectural blueprint grid -->
  <path d="M20 180 L 380 180" stroke="#c084fc" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="200" cy="90" r="100" fill="none" stroke="#e9d5ff" stroke-width="1.2" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Background Multi-Storey Building Silhouette (Right) -->
  <g transform="translate(260, 60)" fill="#7e22ce" fill-opacity="0.5">
    <rect x="0" y="20" width="45" height="100" rx="3"/>
    <rect x="52" y="0" width="40" height="120" rx="3"/>
    <!-- Windows -->
    <rect x="8" y="30" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="25" y="30" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="8" y="50" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="25" y="50" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="60" y="15" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="75" y="15" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="60" y="35" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
    <rect x="75" y="35" width="8" height="10" fill="#e9d5ff" fill-opacity="0.6"/>
  </g>

  <!-- Modern Primary Home (Center) -->
  <g transform="translate(110, 65)">
    <!-- Roof Triangle -->
    <polygon points="70,5 145,48 -5,48" fill="url(#roofGrad)"/>
    <!-- House Front Wall -->
    <rect x="10" y="48" width="120" height="68" rx="2" fill="url(#wallGrad)"/>
    <!-- Front Door -->
    <rect x="55" y="70" width="28" height="46" rx="3" fill="#047857"/>
    <circle cx="76" cy="94" r="2.5" fill="#fde047"/>
    <!-- Windows with Warm Amber Light -->
    <rect x="20" y="60" width="24" height="24" rx="2" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
    <line x1="32" y1="60" x2="32" y2="84" stroke="#d97706" stroke-width="1.5"/>
    <line x1="20" y1="72" x2="44" y2="72" stroke="#d97706" stroke-width="1.5"/>
    
    <rect x="94" y="60" width="24" height="24" rx="2" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
    <line x1="106" y1="60" x2="106" y2="84" stroke="#d97706" stroke-width="1.5"/>
    <line x1="94" y1="72" x2="118" y2="72" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Golden House Key (Left) -->
  <g transform="translate(45, 90) rotate(-20)">
    <circle cx="20" cy="20" r="14" fill="none" stroke="#facc15" stroke-width="4"/>
    <rect x="32" y="17" width="35" height="6" rx="2" fill="#facc15"/>
    <rect x="55" y="23" width="5" height="8" rx="1" fill="#facc15"/>
    <rect x="63" y="23" width="5" height="11" rx="1" fill="#facc15"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="20" y="20" width="150" height="28" rx="14" fill="#3b0764" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2"/>
  <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" letter-spacing="0.5">🏠 AWAS &amp; HOUSING</text>
</svg>
