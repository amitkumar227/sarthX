<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" fill="url(#eduBg)"/>
  
  <!-- Glowing Rings & Stars -->
  <circle cx="200" cy="110" r="95" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="200" cy="110" r="140" fill="none" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="80" cy="60" r="3" fill="#fde047" fill-opacity="0.8"/>
  <circle cx="330" cy="70" r="4" fill="#fde047" fill-opacity="0.7"/>
  <circle cx="310" cy="150" r="2.5" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Open Knowledge Book Base -->
  <g transform="translate(130, 120)">
    <!-- Book pages left -->
    <path d="M70 45 Q 35 30 5 35 L 5 65 Q 35 60 70 75 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M70 48 Q 38 34 10 38 L 10 63 Q 38 58 70 73 Z" fill="#e2e8f0"/>
    <!-- Book pages right -->
    <path d="M70 45 Q 105 30 135 35 L 135 65 Q 105 60 70 75 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M70 48 Q 102 34 130 38 L 130 63 Q 102 58 70 73 Z" fill="#e2e8f0"/>
    <!-- Book spine -->
    <path d="M68 45 L 72 45 L 72 76 L 68 76 Z" fill="#2563eb"/>
  </g>

  <!-- Large Graduation Mortarboard (Top Center) -->
  <g transform="translate(135, 30)">
    <!-- Diamond Cap -->
    <polygon points="65,10 130,35 65,60 0,35" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="65,14 122,35 65,56 8,35" fill="#1e293b"/>
    <!-- Skull Cap Underneath -->
    <path d="M25 45 Q 65 75 105 45 L 105 58 Q 65 88 25 58 Z" fill="#0f172a"/>
    <!-- Golden Button & Tassel -->
    <circle cx="65" cy="35" r="5" fill="url(#goldCap)"/>
    <path d="M65 35 Q 100 40 108 65" stroke="#facc15" stroke-width="2.5" fill="none"/>
    <rect x="104" y="65" width="8" height="16" rx="2" fill="url(#goldCap)"/>
  </g>

  <!-- Diploma Scroll (Right Side) -->
  <g transform="translate(280, 80) rotate(15)">
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="22" y="-2" width="10" height="26" rx="2" fill="#ef4444"/>
    <path d="M24 24 L 20 34 L 27 30 L 34 34 L 30 24 Z" fill="#dc2626"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="20" y="20" width="145" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.5">🎓 SHIKSHA &amp; STUDY</text>
</svg>
