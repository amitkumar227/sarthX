<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="agriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="220" fill="url(#agriBg)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="340" cy="50" r="110" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="340" cy="50" r="75" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Morning Sun -->
  <circle cx="310" cy="70" r="42" fill="url(#sunGrad)"/>
  
  <!-- Rolling Landscape Hills -->
  <path d="M-20 220 Q 80 130 220 170 T 420 150 L 420 220 Z" fill="url(#hill1)"/>
  <path d="M-20 220 Q 140 110 280 160 T 430 180 L 430 220 Z" fill="url(#hill2)"/>

  <!-- Crop Fields / Furrow lines -->
  <path d="M60 220 L 140 160" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M120 220 L 180 165" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M180 220 L 220 170" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Golden Wheat Sheaves (Left) -->
  <g transform="translate(60, 85)">
    <!-- Wheat Stalk 1 -->
    <path d="M30 110 Q 35 60 25 15" stroke="#fde047" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="22" cy="18" rx="6" ry="10" transform="rotate(-25 22 18)" fill="url(#goldGrad)"/>
    <ellipse cx="32" cy="24" rx="6" ry="10" transform="rotate(25 32 24)" fill="url(#goldGrad)"/>
    <ellipse cx="20" cy="36" rx="6" ry="10" transform="rotate(-25 20 36)" fill="url(#goldGrad)"/>
    <ellipse cx="34" cy="42" rx="6" ry="10" transform="rotate(25 34 42)" fill="url(#goldGrad)"/>
    <ellipse cx="23" cy="54" rx="6" ry="10" transform="rotate(-25 23 54)" fill="url(#goldGrad)"/>
    <ellipse cx="35" cy="60" rx="6" ry="10" transform="rotate(25 35 60)" fill="url(#goldGrad)"/>
    
    <!-- Wheat Stalk 2 -->
    <path d="M60 110 Q 55 50 70 20" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="73" cy="22" rx="5" ry="9" transform="rotate(20 73 22)" fill="url(#goldGrad)"/>
    <ellipse cx="61" cy="28" rx="5" ry="9" transform="rotate(-20 61 28)" fill="url(#goldGrad)"/>
    <ellipse cx="76" cy="40" rx="5" ry="9" transform="rotate(20 76 40)" fill="url(#goldGrad)"/>
    <ellipse cx="63" cy="46" rx="5" ry="9" transform="rotate(-20 63 46)" fill="url(#goldGrad)"/>
    <ellipse cx="74" cy="58" rx="5" ry="9" transform="rotate(20 74 58)" fill="url(#goldGrad)"/>
  </g>

  <!-- Tractor Silhouette (Right) -->
  <g transform="translate(230, 135) scale(0.65)">
    <rect x="50" y="20" width="45" height="35" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="15" y="32" width="40" height="23" rx="3" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="55" y="25" width="22" height="15" rx="2" fill="#047857"/>
    <rect x="30" y="15" width="4" height="18" fill="#ffffff"/>
    <circle cx="32" cy="12" r="3" fill="#fde047"/>
    <circle cx="75" cy="58" r="22" fill="#064e3b" stroke="#ffffff" stroke-width="4"/>
    <circle cx="75" cy="58" r="9" fill="#fde047"/>
    <circle cx="25" cy="62" r="14" fill="#064e3b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="25" cy="62" r="5" fill="#fde047"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="20" y="20" width="140" height="28" rx="14" fill="#064e3b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2"/>
  <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">🌾 KRISHI &amp; RURAL</text>
</svg>
