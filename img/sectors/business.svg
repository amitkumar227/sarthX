<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" fill="url(#bizBg)"/>
  
  <!-- Upward Trend Chart in background -->
  <path d="M20 180 L 100 150 L 180 160 L 260 100 L 340 70 L 380 40" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="370,35 385,38 382,53" fill="#facc15"/>
  <circle cx="260" cy="100" r="5" fill="#fde047"/>
  <circle cx="340" cy="70" r="5" fill="#fde047"/>

  <!-- Enterprise / Factory Profile (Left) -->
  <g transform="translate(45, 80)" fill="#ffffff" fill-opacity="0.9">
    <polygon points="0,70 0,35 25,50 25,35 50,50 50,20 75,20 75,70" fill="#a16207"/>
    <!-- Windows -->
    <rect x="10" y="55" width="6" height="8" fill="#fef08a"/>
    <rect x="35" y="55" width="6" height="8" fill="#fef08a"/>
    <rect x="60" y="30" width="6" height="8" fill="#fef08a"/>
    <rect x="60" y="45" width="6" height="8" fill="#fef08a"/>
  </g>

  <!-- Startup Rocket Launching (Center) -->
  <g transform="translate(180, 50) rotate(25)">
    <!-- Rocket Exhaust Flames -->
    <polygon points="12,70 18,95 24,70" fill="#ef4444"/>
    <polygon points="14,70 18,85 22,70" fill="#facc15"/>
    <!-- Rocket Body -->
    <path d="M18 10 C 28 25 30 50 30 70 L 6 70 C 6 50 8 25 18 10 Z" fill="url(#rocketGrad)"/>
    <!-- Rocket Porthole Window -->
    <circle cx="18" cy="35" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <!-- Rocket Fins -->
    <polygon points="6,50 -2,72 6,70" fill="#ef4444"/>
    <polygon points="30,50 38,72 30,70" fill="#ef4444"/>
  </g>

  <!-- MSME Business Briefcase (Right) -->
  <g transform="translate(285, 95)">
    <rect x="10" y="15" width="65" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="10" y="28" width="65" height="4" fill="#d97706"/>
    <!-- Handle -->
    <path d="M30 15 L 30 8 L 55 8 L 55 15" fill="none" stroke="#713f12" stroke-width="3"/>
    <!-- Gold Lock -->
    <rect x="38" y="26" width="9" height="8" rx="2" fill="#facc15"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="20" y="20" width="165" height="28" rx="14" fill="#451a03" fill-opacity="0.85" stroke="#facc15" stroke-width="1.2"/>
  <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fef08a" letter-spacing="0.5">🚀 UDYAM &amp; STARTUP</text>
</svg>
